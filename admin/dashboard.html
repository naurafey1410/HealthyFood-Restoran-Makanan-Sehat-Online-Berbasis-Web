<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Dashboard - Admin HealthyFood</title>
</head>

<body>
    <div class="admin-wrapper">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="admin-content">
            <div class="admin-topbar">
                <div>
                    <h1>Dashboard</h1>
                    <p>Ringkasan aktivitas restoran Anda.</p>
                </div>
            </div>

            <div class="grid-stat">
                <div class="kartu-stat">
                    <div class="ikon"><i class="fa-solid fa-bowl-food"></i></div>
                    <div>
                        <p class="angka" id="stat-produk">0</p>
                        <p class="label">Total Produk</p>
                    </div>
                </div>
                <div class="kartu-stat">
                    <div class="ikon"><i class="fa-solid fa-receipt"></i></div>
                    <div>
                        <p class="angka" id="stat-pesanan">0</p>
                        <p class="label">Total Pesanan</p>
                    </div>
                </div>
                <div class="kartu-stat">
                    <div class="ikon"><i class="fa-solid fa-hourglass-half"></i></div>
                    <div>
                        <p class="angka" id="stat-verifikasi">0</p>
                        <p class="label">Perlu Verifikasi</p>
                    </div>
                </div>
                <div class="kartu-stat">
                    <div class="ikon"><i class="fa-solid fa-sack-dollar"></i></div>
                    <div>
                        <p class="angka" id="stat-pendapatan">Rp 0</p>
                        <p class="label">Pendapatan (Lunas)</p>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h2>Pesanan Terbaru</h2>
                <table>
                    <thead>
                        <tr>
                            <th>No. Pesanan</th>
                            <th>Tanggal</th>
                            <th>Pembeli</th>
                            <th>Total</th>
                            <th>Pembayaran</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-terbaru"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../data.js?v=3"></script>
    <script src="js/admin.js?v=3"></script>
    <script src="js/dashboard.js?v=3"></script>
</body>
</html>
