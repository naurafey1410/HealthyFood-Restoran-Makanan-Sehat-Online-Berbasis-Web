<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Katering - Admin HealthyFood</title>
</head>

<body>
    <div class="admin-wrapper">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="admin-content">
            <div class="admin-topbar">
                <div>
                    <h1>Kelola Katering</h1>
                    <p>Paket ini tampil saat customer menekan menu Catering.</p>
                </div>
                <button class="btn-hijau" id="btn-tambah">
                    <i class="fa-solid fa-plus"></i> Tambah Paket
                </button>
            </div>

            <div class="panel">
                <table>
                    <thead>
                        <tr>
                            <th>Nama Paket</th>
                            <th>Deskripsi</th>
                            <th>Harga / Porsi</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-katering"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modal-katering">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="judul-modal">Tambah Paket</h2>
                <button type="button" class="btn-x" data-tutup><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="form-katering">
                <div class="form-grup">
                    <label for="input-nama">Nama Paket</label>
                    <input type="text" id="input-nama" required>
                </div>
                <div class="form-grup">
                    <label for="input-deskripsi">Deskripsi</label>
                    <textarea id="input-deskripsi" required></textarea>
                </div>
                <div class="form-grup">
                    <label for="input-harga">Harga per Porsi (Rp)</label>
                    <input type="number" id="input-harga" min="0" required>
                </div>

                <div class="form-aksi">
                    <button type="button" class="btn-batal" data-tutup>Batal</button>
                    <button type="submit" class="btn-hijau">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../data.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/katering.js"></script>
</body>
</html>
