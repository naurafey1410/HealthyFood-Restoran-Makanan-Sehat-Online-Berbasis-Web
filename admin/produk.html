<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Produk - Admin HealthyFood</title>
</head>

<body>
    <div class="admin-wrapper">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="admin-content">
            <div class="admin-topbar">
                <div>
                    <h1>Kelola Produk</h1>
                    <p>Perubahan di sini langsung tampil di halaman customer.</p>
                </div>
                <button class="btn-hijau" id="btn-tambah">
                    <i class="fa-solid fa-plus"></i> Tambah Produk
                </button>
            </div>

            <div class="panel">
                <table>
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Nama</th>
                            <th>Kalori</th>
                            <th>Harga</th>
                            <th>Grup</th>
                            <th>Best Seller</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-produk"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modal-produk">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="judul-modal">Tambah Produk</h2>
                <button type="button" class="btn-x" data-tutup><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="form-produk">
                <div class="form-grup">
                    <label for="input-nama">Nama Produk</label>
                    <input type="text" id="input-nama" required>
                </div>
                <div class="form-grup">
                    <label for="input-kalori">Kalori</label>
                    <input type="text" id="input-kalori" placeholder="250 - 350 kkal" required>
                </div>
                <div class="form-grup">
                    <label for="input-harga">Harga (Rp)</label>
                    <input type="number" id="input-harga" min="0" required>
                </div>
                <div class="form-grup">
                    <label>Foto Produk</label>
                    <input type="hidden" id="input-gambar">
                    <div class="pilih-gambar-grid" id="pilih-gambar"></div>
                    <small class="pesan-gambar" id="pesan-gambar">Klik salah satu gambar untuk memilih.</small>
                </div>
                <div class="form-grup">
                    <label for="input-grup">Grup Kartu (opsional)</label>
                    <input type="text" id="input-grup" placeholder="sarapan">
                    <small>Menu dengan nama grup yang sama tampil dalam satu kartu.</small>
                </div>
                <div class="form-grup form-checkbox">
                    <input type="checkbox" id="input-best">
                    <label for="input-best">Tampilkan label Best Seller</label>
                </div>

                <div class="form-aksi">
                    <button type="button" class="btn-batal" data-tutup>Batal</button>
                    <button type="submit" class="btn-hijau">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../data.js?v=3"></script>
    <script src="js/admin.js?v=3"></script>
    <script src="js/produk.js?v=3"></script>
</body>
</html>
